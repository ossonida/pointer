<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a10">
<title>Pointer · 포인트 카운터</title>
<style>
:root{color-scheme:dark;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#080a10;color:#f6f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #80caff;outline-offset:4px}button{border:0}main{max-width:960px;margin:auto;padding:32px 20px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#398fff}.caption{color:#929bad;font-size:13px;margin-top:7px}.toolbar{display:flex;gap:10px}.tool{background:#141d2c;border:1px solid #253553;border-radius:14px;color:#72adff;padding:12px 16px}.primary{background:#237bff;color:white;border:0}.stats{font-size:12px;letter-spacing:2px;color:#7a8497;margin-bottom:14px}.cards{display:grid;gap:14px}.card{border-radius:26px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(100px,160px) 76px;align-items:center;gap:12px;min-height:140px;color:var(--ink);background:var(--color)}.name{background:none;color:inherit;padding:8px 0;text-align:left;min-width:0}.name strong{display:block;font-size:27px;overflow-wrap:anywhere}.name small{display:block;opacity:.6;font-size:11px;margin-top:8px}.step{border-radius:50%;width:76px;height:76px;background:var(--shade);color:inherit;font-size:40px;font-weight:300;line-height:1;touch-action:manipulation}.score{background:none;color:inherit;font-size:48px;font-weight:800;padding:10px 0;overflow-wrap:anywhere;min-width:0}.empty{border:1px dashed #29344b;border-radius:26px;text-align:center;padding:90px 24px;background:radial-gradient(ellipse at top,#15233d,transparent 70%)}.empty-icon{color:#70aaff;font-size:44px;margin-bottom:20px}.empty h1{font-size:26px;margin:0 0 12px}.empty p{color:#939eb1;line-height:1.8;margin-bottom:26px}.empty button{padding:15px 24px;border-radius:14px}footer{text-align:center;color:#717c90;font-size:12px;margin-top:26px}dialog{border:1px solid #303c52;background:#111722;color:white;border-radius:24px;padding:28px;width:calc(100% - 32px);max-width:440px}dialog::backdrop{background:#000a;backdrop-filter:blur(6px)}h2{font-size:24px;margin:0 0 24px}.field{display:block;color:#aab6ca;font-size:13px;margin:20px 0 9px}input[type=text],input[type=number]{width:100%;padding:15px;background:#080d16;border:1px solid #344158;border-radius:12px;color:white;font-size:20px}input[type=color]{width:54px;height:44px;border:0;background:none;cursor:pointer}.color-row{display:flex;align-items:center;gap:12px}.palette{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.swatch{width:32px;height:32px;border-radius:50%;background:var(--swatch);border:2px solid transparent}.swatch.selected{outline:2px solid white;outline-offset:3px}.swatch:disabled{opacity:.18;cursor:not-allowed}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}.actions button,.random{padding:12px 16px;border-radius:12px;background:#243047;color:white}.actions .primary{background:#237bff}.actions .danger{color:#ff8b99;background:#341d29;margin-right:auto}.error{color:#ff9eaa;min-height:18px;font-size:13px;margin-top:12px}.signs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.signs button{padding:14px;background:#202b3e;color:#aab6ca;border-radius:12px;border:1px solid transparent}.signs button.active{background:#163a6a;border-color:#4b9cff;color:#fff}.hint{font-size:13px;color:#98a6bd;line-height:1.7}.preview{font-size:19px;color:#c9deff;margin-top:18px} @media(max-width:600px){main{padding:24px 12px}header{margin-bottom:24px}.brand{font-size:22px}.tool{padding:11px 12px;font-size:13px}.card{grid-template-columns:minmax(0,1fr) 52px minmax(64px,100px) 52px;padding:22px 18px;gap:6px;min-height:124px;border-radius:23px}.step{width:52px;height:52px;font-size:32px}.name strong{font-size:22px}.score{font-size:38px}.caption{font-size:11px}.empty{padding:65px 15px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .2s ease-out}.step:active{transform:scale(.92)}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main>
 <header><div><div class="brand">pointer<span> /</span></div><div class="caption">함께 쌓는 점수, 한눈에.</div></div><div class="toolbar"><button class="tool" id="reset">점수 초기화</button><button class="tool primary" id="add">＋ 플레이어</button></div></header>
 <div class="stats" id="stats"></div><section class="cards" id="cards" aria-label="플레이어 점수"></section>
 <footer>이름을 누르면 수정 · 점수를 누르면 직접 입력<br><br>이 브라우저에 자동 저장됩니다</footer>
</main>
<dialog id="playerDialog"><form id="playerForm"><h2 id="playerTitle">플레이어 추가</h2><label class="field" for="nickname">닉네임</label><input id="nickname" type="text" maxlength="30" placeholder="닉네임을 입력하세요" required autocomplete="off"><label class="field" for="color">플레이어 컬러</label><div class="color-row"><input id="color" type="color"><button class="random" id="random" type="button">↻ 랜덤 컬러</button></div><div class="palette" id="palette"></div><p class="hint">다른 플레이어가 사용 중인 컬러는 선택할 수 없어요.</p><div class="error" id="playerError" role="alert"></div><div class="actions"><button class="danger" id="remove" type="button">삭제</button><button type="button" data-close>취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
<dialog id="scoreDialog"><form id="scoreForm"><h2 id="scoreTitle">점수 추가</h2><div class="signs"><button type="button" id="positive" class="active" aria-pressed="true">＋ 더하기</button><button type="button" id="negative" aria-pressed="false">− 빼기</button></div><label class="field" for="amount">변경할 점수</label><input id="amount" type="number" min="0" step="1" required placeholder="예: 10" inputmode="numeric"><div class="preview" id="preview" aria-live="polite"></div><div class="error" id="scoreError" role="alert"></div><div class="actions"><button type="button" data-close>취소</button><button class="primary" type="submit">적용</button></div></form></dialog>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p class="hint" id="confirmText"></p><div class="actions"><button data-close>취소</button><button class="primary" id="confirm">확인</button></div></dialog>
<script>
'use strict';
const KEY='pointer.players.v1';
const colors=['#52c7ef','#ffcc00','#b44cdb','#b19be6','#087fff','#ff2496','#f9dcec','#45d9a0','#ff9461','#a9d951','#6bd6d3','#e86b70'];
let players=[],editing=null,scoring=null,sign=1,pending=null;
const $=id=>document.getElementById(id);
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))players=saved.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&/^#[0-9a-f]{6}$/i.test(p.color)&&Number.isSafeInteger(p.score)).map(p=>({...p,color:p.color.toLowerCase()}));}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(players));$('stats').title='자동 저장 완료';}catch{$('stats').title='브라우저 저장 공간을 사용할 수 없습니다';}render();}
function used(color){return players.some(p=>p.id!==editing&&p.color===color.toLowerCase());}
function randomColor(){const available=colors.filter(c=>!used(c));if(available.length)return available[Math.floor(Math.random()*available.length)];let c;do{c='#'+Math.floor(Math.random()*0x1000000).toString(16).padStart(6,'0');}while(used(c));return c;}
function ink(color){const rgb=color.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>.179?'#10131a':'#ffffff';}
function render(){const container=$('cards');container.replaceChildren();$('stats').textContent=`PLAYERS / ${String(players.length).padStart(2,'0')}`;$('reset').disabled=!players.length;if(!players.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div class="empty-icon">＋</div><h1>첫 번째 플레이어를 추가하세요</h1><p>닉네임과 컬러를 정하면 준비 끝.<br>플레이어를 추가하고 점수를 기록해 보세요.</p><button class="primary">＋ 플레이어 추가</button>';empty.querySelector('button').onclick=()=>openPlayer();container.append(empty);return;}for(const p of players){const card=document.createElement('article');card.className='card';card.style.setProperty('--color',p.color);const fg=ink(p.color);card.style.setProperty('--ink',fg);card.style.setProperty('--shade',fg==='#ffffff'?'#ffffff30':'#00000022');const name=document.createElement('button');name.className='name';name.setAttribute('aria-label',`${p.name} 수정 또는 삭제`);const strong=document.createElement('strong');strong.textContent=p.name;const small=document.createElement('small');small.textContent='수정 · 삭제';name.append(strong,small);name.onclick=()=>openPlayer(p.id);const minus=document.createElement('button');minus.className='step';minus.textContent='−';minus.setAttribute('aria-label',`${p.name} 1점 빼기`);minus.onclick=()=>change(p,-1);const score=document.createElement('button');score.className='score';score.textContent=p.score.toLocaleString('ko-KR');score.setAttribute('aria-label',`${p.name} 점수 ${p.score}, 직접 입력`);score.onclick=()=>openScore(p.id);const plus=document.createElement('button');plus.className='step';plus.textContent='＋';plus.setAttribute('aria-label',`${p.name} 1점 더하기`);plus.onclick=()=>change(p,1);card.append(name,minus,score,plus);container.append(card);}}
function change(p,delta){if(!Number.isSafeInteger(p.score+delta)){alert('입력 가능한 점수 범위를 초과했어요.');return false;}p.score+=delta;save();return true;}
function palette(){const box=$('palette');box.replaceChildren();for(const c of colors){const b=document.createElement('button');b.type='button';b.className='swatch'+($('color').value===c?' selected':'');b.style.setProperty('--swatch',c);b.disabled=used(c);b.setAttribute('aria-label',`${c} 컬러${b.disabled?' (사용 중)':''}`);b.setAttribute('aria-pressed',String($('color').value===c));b.onclick=()=>{$('color').value=c;palette();};box.append(b);}}
function openPlayer(id=null){editing=id;const p=players.find(p=>p.id===id);$('playerTitle').textContent=p?'플레이어 수정':'플레이어 추가';$('nickname').value=p?p.name:'';$('color').value=p?p.color:randomColor();$('remove').hidden=!p;$('playerError').textContent='';palette();$('playerDialog').showModal();$('nickname').focus();}
$('playerForm').onsubmit=e=>{e.preventDefault();const name=$('nickname').value.trim(),color=$('color').value.toLowerCase();if(!name){$('playerError').textContent='닉네임을 입력해주세요.';return;}if(used(color)){$('playerError').textContent='이미 사용 중인 컬러예요. 다른 컬러를 선택해주세요.';return;}const p=players.find(p=>p.id===editing);if(p){p.name=name;p.color=color;}else players.push({id:crypto.randomUUID(),name,color,score:0});save();$('playerDialog').close();};
$('random').onclick=()=>{$('color').value=randomColor();palette();};$('color').oninput=palette;$('add').onclick=()=>openPlayer();
function confirmation(title,message,callback){$('confirmTitle').textContent=title;$('confirmText').textContent=message;pending=callback;$('confirmDialog').showModal();}
$('remove').onclick=()=>{const p=players.find(p=>p.id===editing);confirmation('플레이어 삭제',`${p.name} 플레이어와 점수를 삭제할까요?`,()=>{players=players.filter(x=>x.id!==p.id);save();$('playerDialog').close();});};
$('reset').onclick=()=>confirmation('점수 초기화','모든 플레이어의 점수를 0으로 초기화할까요?',()=>{players.forEach(p=>p.score=0);save();});
$('confirm').onclick=()=>{const callback=pending;pending=null;$('confirmDialog').close();if(callback)callback();};
function setSign(value){sign=value;for(const [id,s] of [['positive',1],['negative',-1]]){$(id).classList.toggle('active',s===sign);$(id).setAttribute('aria-pressed',String(s===sign));}preview();}
function preview(){const p=players.find(p=>p.id===scoring);const a=Number($('amount').value);$('preview').textContent=p?`${p.score.toLocaleString('ko-KR')} ${sign===1?'+':'−'} ${Number.isSafeInteger(a)&&a>=0?a.toLocaleString('ko-KR'):'…'} = ${Number.isSafeInteger(a)&&a>=0&&Number.isSafeInteger(p.score+sign*a)?(p.score+sign*a).toLocaleString('ko-KR'):'…'}`:'';}
function openScore(id){scoring=id;const p=players.find(p=>p.id===id);$('scoreTitle').textContent=`${p.name} · 점수 입력`;$('amount').value='';$('scoreError').textContent='';setSign(1);$('scoreDialog').showModal();$('amount').focus();}
$('positive').onclick=()=>setSign(1);$('negative').onclick=()=>setSign(-1);$('amount').oninput=preview;
$('scoreForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);const p=players.find(p=>p.id===scoring);if(!$('amount').value.trim()||!Number.isSafeInteger(amount)||amount<0||!Number.isSafeInteger(p.score+sign*amount)){$('scoreError').textContent='범위 내의 0 이상 정수를 입력해주세요.';return;}if(change(p,sign*amount))$('scoreDialog').close();};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
render();
</script>
</body>
</html>
