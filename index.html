<style>
:root{color-scheme:dark;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#080a10;color:#f6f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #80caff;outline-offset:4px}button{border:0}main{max-width:960px;margin:auto;padding:32px 20px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#398fff}.caption{color:#929bad;font-size:13px;margin-top:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}header{flex-wrap:wrap}.rank{display:block;font-size:12px;font-weight:700;margin-bottom:8px;opacity:.7}@media(max-width:600px){.toolbar{width:100%;display:grid;grid-template-columns:1fr 1fr}.tool{min-height:44px}}.tool{background:#141d2c;border:1px solid #253553;border-radius:14px;color:#72adff;padding:12px 16px}.primary{background:#237bff;color:white;border:0}.stats{font-size:12px;letter-spacing:2px;color:#7a8497;margin-bottom:14px}.cards{display:grid;gap:14px}.card{border-radius:26px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(100px,160px) 76px;align-items:center;gap:12px;min-height:140px;color:var(--ink);background:var(--color)}.name{background:none;color:inherit;padding:8px 0;text-align:left;min-width:0}.name strong{display:block;font-size:27px;overflow-wrap:anywhere}.name small{display:block;opacity:.6;font-size:11px;margin-top:8px}.step{border-radius:50%;width:76px;height:76px;background:var(--shade);color:inherit;font-size:40px;font-weight:300;line-height:1;touch-action:manipulation}.score{background:none;color:inherit;font-size:48px;font-weight:800;padding:10px 0;overflow-wrap:anywhere;min-width:0}.empty{border:1px dashed #29344b;border-radius:26px;text-align:center;padding:90px 24px;background:radial-gradient(ellipse at top,#15233d,transparent 70%)}.empty-icon{color:#70aaff;font-size:44px;margin-bottom:20px}.empty h1{font-size:26px;margin:0 0 12px}.empty p{color:#939eb1;line-height:1.8;margin-bottom:26px}.empty button{padding:15px 24px;border-radius:14px}footer{text-align:center;color:#717c90;font-size:12px;margin-top:26px}dialog{border:1px solid #303c52;background:#111722;color:white;border-radius:24px;padding:28px;width:calc(100% - 32px);max-width:440px}dialog::backdrop{background:#000a;backdrop-filter:blur(6px)}h2{font-size:24px;margin:0 0 24px}.field{display:block;color:#aab6ca;font-size:13px;margin:20px 0 9px}input[type=text],input[type=number]{width:100%;padding:15px;background:#080d16;border:1px solid #344158;border-radius:12px;color:white;font-size:20px}input[type=color]{width:54px;height:44px;border:0;background:none;cursor:pointer}.color-row{display:flex;align-items:center;gap:12px}.palette{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.swatch{width:32px;height:32px;border-radius:50%;background:var(--swatch);border:2px solid transparent}.swatch.selected{outline:2px solid white;outline-offset:3px}.swatch:disabled{opacity:.18;cursor:not-allowed}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}.actions button,.random{padding:12px 16px;border-radius:12px;background:#243047;color:white}.actions .primary{background:#237bff}.actions .danger{color:#ff8b99;background:#341d29;margin-right:auto}.error{color:#ff9eaa;min-height:18px;font-size:13px;margin-top:12px}.signs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.signs button{padding:14px;background:#202b3e;color:#aab6ca;border-radius:12px;border:1px solid transparent}.signs button.active{background:#163a6a;border-color:#4b9cff;color:#fff}.hint{font-size:13px;color:#98a6bd;line-height:1.7}.preview{font-size:19px;color:#c9deff;margin-top:18px} @media(max-width:600px){main{padding:24px 12px}header{margin-bottom:24px}.brand{font-size:22px}.tool{padding:11px 12px;font-size:13px}.card{grid-template-columns:minmax(0,1fr) 52px minmax(64px,100px) 52px;padding:22px 18px;gap:6px;min-height:124px;border-radius:23px}.step{width:52px;height:52px;font-size:32px}.name strong{font-size:22px}.score{font-size:38px}.caption{font-size:11px}.empty{padding:65px 15px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .2s ease-out}.step:active{transform:scale(.92)}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Compact toolbar and player cards */
main{padding-top:22px}
header{flex-wrap:nowrap;gap:8px;margin-bottom:20px}
.toolbar{display:flex;flex-wrap:nowrap;width:auto;gap:6px;flex-shrink:0}
.tool{display:flex;align-items:center;justify-content:center;width:42px;height:42px;min-height:42px;padding:9px;border-radius:12px;flex-shrink:0}
.tool svg{width:23px;height:23px}
.tool:disabled{opacity:.35;cursor:default}
.cards{gap:8px}
.card{min-height:82px;padding:12px 18px;border-radius:18px;grid-template-columns:minmax(0,1fr) 48px minmax(80px,130px) 48px;gap:10px}
.step{width:48px;height:48px;font-size:30px}
.score{font-size:34px;padding:4px 0}
.name{padding:0}
.name strong{font-size:22px;line-height:1.2}
.name small{display:none}
.rank{font-size:11px;margin-bottom:4px}
.stats{margin-bottom:10px}
footer{margin-top:18px}
@media(max-width:600px){
main{padding:16px 10px 28px}
header{margin-bottom:16px}
.brand{font-size:21px}
.caption{display:none}
.toolbar{display:flex;width:auto;gap:4px}
.tool{width:40px;height:40px;min-height:40px;padding:8px;border-radius:11px}
.card{min-height:72px;padding:10px 12px;border-radius:16px;grid-template-columns:minmax(0,1fr) 44px minmax(60px,88px) 44px;gap:6px}
.step{width:44px;height:44px;font-size:28px}
.score{font-size:30px}
.name strong{font-size:19px}
.rank{font-size:10px;margin-bottom:3px}
.cards{gap:7px}
}

/* Keep dialogs within the space above the software keyboard. */
dialog{position:fixed;margin:0;left:50%;top:calc(var(--keyboard-top,0px) + var(--keyboard-height,100dvh)/2);transform:translate(-50%,-50%);max-height:calc(var(--keyboard-height,100dvh) - 16px);overflow:auto;padding:20px}
dialog h2{font-size:21px;margin-bottom:16px}
dialog .field{margin:12px 0 7px}
dialog .hint{margin:10px 0;font-size:12px;line-height:1.5}
dialog .actions{margin-top:16px}
dialog .palette{gap:9px;margin-top:10px}
dialog .swatch{width:28px;height:28px}
.error:empty{display:none}
#scoreDialog{padding:14px 16px;border-radius:18px}
.score-heading{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#scoreDialog h2{flex:1;min-width:0;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-close{width:36px;height:36px;padding:0;flex-shrink:0;border-radius:10px;background:#243047;color:#ccd9ed;font-size:26px}
#scoreDialog .signs{gap:8px}
#scoreDialog .signs button{min-height:40px;padding:8px 12px}
.score-entry{display:flex;gap:8px;margin-top:10px;align-items:stretch}
#scoreDialog #amount{min-width:0;flex:1;width:0;height:48px;padding:10px 12px;font-size:24px}
.score-entry button{min-width:72px;padding:10px 14px;border-radius:12px}
#scoreDialog .preview{margin-top:9px;font-size:14px;line-height:20px;overflow-wrap:anywhere}
#scoreDialog .error{margin-top:6px;min-height:0;font-size:12px}
@media(max-width:600px){dialog{padding:16px}#playerDialog .hint{display:none}}

/* Position changes use FLIP animation; rising cards pass above their neighbors. */
.card{position:relative;animation:none;transform-origin:center}

/* Swipe actions stay inside the card; rank motion remains on the outer card. */
.card{padding:0;display:block;min-height:0;overflow:hidden;background:#b92542}
.card-content{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(80px,130px) 48px;gap:10px;align-items:center;min-height:82px;padding:12px 18px;background:var(--color);border-radius:inherit;touch-action:pan-y;transition:transform .2s ease}
.swipe-open .card-content{transform:translateX(-84px)}
.swipe-dragging .card-content{transition:none;user-select:none}
.swipe-delete{position:absolute;right:0;top:0;bottom:0;width:84px;color:#fff;background:#b92542;font-weight:700;font-size:15px}
@media(max-width:600px){.card{padding:0;min-height:0}.card-content{min-height:72px;padding:10px 12px;grid-template-columns:minmax(0,1fr) 44px minmax(60px,88px) 44px;gap:6px}}
@media(prefers-reduced-motion:reduce){.card-content{transition:none}}

.card,.card-content,.card-content button,.swipe-delete{touch-action:pan-y}
.card-content,.card-content button{user-select:none;-webkit-user-select:none}

/* Nickname and save action stay together above the mobile keyboard. */
#playerDialog{padding:14px 16px;border-radius:18px}
.player-heading{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#playerDialog h2{flex:1;margin:0;font-size:18px;min-width:0}
.player-remove{padding:8px 10px;border-radius:9px;background:#341d29;color:#ff8b99;font-size:13px}
.player-entry{display:flex;align-items:stretch;gap:8px}
#playerDialog #nickname{min-width:0;flex:1;width:0;height:46px;padding:10px 12px;font-size:20px}
.player-entry button{min-width:72px;padding:10px 14px;border-radius:12px}
#playerDialog .color-row{margin-top:10px;gap:10px;height:36px}
#playerDialog .color-row label{font-size:13px;color:#aab6ca}
#playerDialog input[type=color]{width:44px;height:34px;padding:0}
#playerDialog .random{margin-left:auto;padding:8px 12px;font-size:13px}
#playerDialog .palette{margin-top:10px;gap:8px}
#playerDialog .swatch{width:24px;height:24px}
#playerDialog .error{margin-top:8px;min-height:0;font-size:12px}

/* Up to six players share the available mobile screen height. */
@media(max-width:600px){
.fit-players main{height:100svh;display:flex;flex-direction:column}
.fit-players header,.fit-players .stats,.fit-players footer{flex-shrink:0}
.fit-players .cards{flex:1;min-height:calc(var(--player-count)*72px + (var(--player-count) - 1)*7px);grid-template-rows:repeat(var(--player-count),minmax(72px,1fr))}
.fit-players .card{height:100%;min-height:72px}
.fit-players .card-content{height:100%}
}

.brand{white-space:nowrap}
@media(max-width:600px){.brand{font-size:18px;letter-spacing:-.6px}}
@media(max-width:380px){.brand{font-size:15px}}

/* Scale scores with expanded card height; keep long numbers within their column. */
@media(max-width:600px){
.fit-players .card{container-type:size}
.fit-players .score{font-size:min(clamp(30px,34cqh,100px),calc(82px / (var(--score-chars,1) * .65)));line-height:1.1}
}

/* Player names scale with tall mobile cards, with a medium font weight. */
.name strong{font-weight:500}
@media(max-width:600px){
.fit-players .name strong{font-size:clamp(19px,15cqh,34px);font-weight:500;line-height:1.25}
}
</style>

</head>
<body>
<main>
 <header><div><div class="brand">Score Counter</div><div class="caption">함께 쌓는 점수, 한눈에.</div></div><div class="toolbar"><button class="tool" id="reset" aria-label="점수 초기화" title="점수 초기화"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 8"/><path d="M3 4v6h6"/><path d="M12 8v4l3 2"/></svg></button><button class="tool" id="resetPlayers" aria-label="플레이어 전체 리셋" title="플레이어 전체 리셋"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M3 21v-2a6 6 0 0 1 10-4"/><path d="m16 15 5 6m0-6-5 6"/></svg></button><button class="tool" id="bulk" aria-label="여러 명 추가" title="여러 명 추가"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="3"/><path d="M2 21v-2a6 6 0 0 1 12 0v2M15 4a3 3 0 0 1 0 6m3 4v6m-3-3h6"/></svg></button><button class="tool primary" id="add" aria-label="플레이어 추가" title="플레이어 추가"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M3 21v-2a6 6 0 0 1 10-4m5-3v8m-4-4h8"/></svg></button></div></header>
 <div class="stats" id="stats"></div><section class="cards" id="cards" aria-label="플레이어 점수"></section>
 <footer>왼쪽으로 밀면 삭제 · 이름을 누르면 수정 / 점수를 누르면 직접 입력<br><br>이 브라우저에 자동 저장됩니다</footer>
</main>
<dialog id="playerDialog"><form id="playerForm"><div class="player-heading"><h2 id="playerTitle">플레이어 추가</h2><button class="player-remove" id="remove" type="button">삭제</button><button class="score-close" type="button" data-close aria-label="플레이어 입력 취소" title="취소">×</button></div><div class="player-entry"><input id="nickname" type="text" maxlength="30" placeholder="닉네임" aria-label="닉네임" required autocomplete="off" enterkeyhint="done"><button class="primary" type="submit">저장</button></div><div class="color-row"><label for="color">컬러</label><input id="color" type="color"><button class="random" id="random" type="button">↻ 랜덤</button></div><div class="palette" id="palette" aria-label="플레이어 컬러 선택"></div><div class="error" id="playerError" role="alert"></div></form></dialog>
<dialog id="scoreDialog"><form id="scoreForm"><div class="score-heading"><h2 id="scoreTitle">점수 입력</h2><button type="button" class="score-close" data-close aria-label="점수 입력 취소">×</button></div><div class="signs"><button type="button" id="positive" class="active" aria-pressed="true">＋ 더하기</button><button type="button" id="negative" aria-pressed="false">− 빼기</button></div><div class="score-entry"><input id="amount" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="점수" aria-label="변경할 점수"><button class="primary" type="submit">적용</button></div><div class="preview" id="preview" aria-live="polite"></div><div class="error" id="scoreError" role="alert"></div></form></dialog>
<dialog id="bulkDialog"><form id="bulkForm"><h2>여러 명 추가</h2><p class="hint">기존 플레이어는 유지하고, 자동 이름과 서로 다른 컬러로 한 번에 추가합니다.</p><label class="field" for="bulkCount">추가할 인원</label><input id="bulkCount" type="text" pattern="[0-9]*" value="4" required inputmode="numeric" enterkeyhint="done" autocomplete="off"><div class="error" id="bulkError" role="alert"></div><div class="actions"><button type="button" data-close>취소</button><button class="primary" type="submit">추가</button></div></form></dialog>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p class="hint" id="confirmText"></p><div class="actions"><button data-close>취소</button><button class="primary" id="confirm">확인</button></div></dialog>
<script>
'use strict';
const KEY='pointer.players.v1';
const colors=['#52c7ef','#ffcc00','#b44cdb','#b19be6','#087fff','#ff2496','#f9dcec','#45d9a0','#ff9461','#a9d951','#6bd6d3','#e86b70'];
let players=[],editing=null,scoring=null,sign=1,pending=null,swipedId=null;
const $=id=>document.getElementById(id);
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))players=saved.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&/^#[0-9a-f]{6}$/i.test(p.color)&&Number.isSafeInteger(p.score)).map(p=>({...p,color:p.color.toLowerCase()}));}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(players));$('stats').title='자동 저장 완료';}catch{$('stats').title='브라우저 저장 공간을 사용할 수 없습니다';}render();}
function used(color){return players.some(p=>p.id!==editing&&p.color===color.toLowerCase());}
function randomColor(excludedId=editing){const occupied=c=>players.some(p=>p.id!==excludedId&&p.color===c);const available=colors.filter(c=>!occupied(c));if(available.length)return available[Math.floor(Math.random()*available.length)];let c;do{c='#'+Math.floor(Math.random()*0x1000000).toString(16).padStart(6,'0');}while(occupied(c));return c;}
function ink(color){const rgb=color.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>.179?'#10131a':'#ffffff';}
function render(){document.documentElement.classList.toggle('fit-players',players.length>0&&players.length<=6);document.documentElement.style.setProperty('--player-count',String(players.length||1));const container=$('cards');const previous=new Map([...container.querySelectorAll('.card')].map(card=>[card.dataset.playerId,card.getBoundingClientRect()]));container.replaceChildren();$('stats').textContent=`PLAYERS / ${String(players.length).padStart(2,'0')}`;$('reset').disabled=!players.length;$('resetPlayers').disabled=!players.length;if(!players.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div class="empty-icon">＋</div><h1>첫 번째 플레이어를 추가하세요</h1><p>닉네임과 컬러를 정하면 준비 끝.<br>플레이어를 추가하고 점수를 기록해 보세요.</p><button class="primary">＋ 플레이어 추가</button>';empty.querySelector('button').onclick=()=>openPlayer();container.append(empty);return;}const ranked=[...players].sort((a,b)=>b.score-a.score);for(const [index,p] of ranked.entries()){const card=document.createElement('article');card.className='card';card.dataset.playerId=p.id;card.style.setProperty('--color',p.color);const fg=ink(p.color);card.style.setProperty('--ink',fg);card.style.setProperty('--shade',fg==='#ffffff'?'#ffffff30':'#00000022');const name=document.createElement('button');name.className='name';name.setAttribute('aria-label',`${p.name} 수정 또는 삭제`);const rank=document.createElement('span');rank.className='rank';rank.textContent=`${ranked.findIndex(x=>x.score===p.score)+1}위`;const strong=document.createElement('strong');strong.textContent=p.name;const small=document.createElement('small');small.textContent='수정 · 삭제';name.append(rank,strong,small);name.onclick=()=>openPlayer(p.id);const minus=document.createElement('button');minus.className='step';minus.textContent='−';minus.setAttribute('aria-label',`${p.name} 1점 빼기`);minus.onclick=()=>change(p,-1);const score=document.createElement('button');score.className='score';score.textContent=p.score.toLocaleString('ko-KR');score.style.setProperty('--score-chars',String(score.textContent.length));score.setAttribute('aria-label',`${p.name} 점수 ${p.score}, 직접 입력`);score.onclick=()=>openScore(p.id);const plus=document.createElement('button');plus.className='step';plus.textContent='＋';plus.setAttribute('aria-label',`${p.name} 1점 더하기`);plus.onclick=()=>change(p,1);const content=document.createElement('div');content.className='card-content';content.append(name,minus,score,plus);const remove=document.createElement('button');remove.className='swipe-delete';remove.textContent='삭제';remove.setAttribute('aria-label',`${p.name} 삭제`);remove.onclick=()=>deletePlayer(p.id);card.append(remove,content);setupSwipe(card,content,remove,p.id);container.append(card);}animateRanking(container,previous);}
function setupSwipe(card,content,remove,id){
let startX=0,startY=0,startOffset=0,offset=0,dragging=false,horizontal=false,suppressUntil=0,pointerId=null;
function settle(open){card.classList.remove('swipe-dragging');card.classList.toggle('swipe-open',open);content.style.transform='';remove.tabIndex=open?0:-1;remove.setAttribute('aria-hidden',String(!open));offset=open?-84:0;}
settle(swipedId===id);
card.addEventListener('pointerdown',e=>{
if(e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;startOffset=card.classList.contains('swipe-open')?-84:0;offset=startOffset;dragging=true;horizontal=false;
});
card.addEventListener('pointermove',e=>{
if(!dragging||e.pointerId!==pointerId)return;
const dx=e.clientX-startX,dy=e.clientY-startY;
if(!horizontal){
if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)*1.3){dragging=false;return;}
if(Math.abs(dx)<6||Math.abs(dx)<Math.abs(dy))return;
horizontal=true;card.classList.add('swipe-dragging');card.setPointerCapture(e.pointerId);
}
if(e.cancelable)e.preventDefault();
offset=Math.max(-84,Math.min(0,startOffset+dx));content.style.transform=`translateX(${offset}px)`;
});
function finish(e,cancelled){
if(!dragging||e.pointerId!==pointerId)return;
dragging=false;
if(!horizontal)return;
suppressUntil=Date.now()+400;
const distance=e.clientX-startX;
const open=cancelled?startOffset<0:distance>18?false:distance<-18?true:startOffset<0;
if(open){document.querySelectorAll('.swipe-open').forEach(other=>{if(other!==card){other.classList.remove('swipe-open');const button=other.querySelector('.swipe-delete');button.tabIndex=-1;button.setAttribute('aria-hidden','true');}});swipedId=id;}
else if(swipedId===id)swipedId=null;
settle(open);
}
card.addEventListener('pointerup',e=>finish(e,false));
card.addEventListener('pointercancel',e=>finish(e,true));
// Capturing a pointer from a child button emits lostpointercapture on that button.
// Do not treat that bubbling event as a cancelled swipe.
card.addEventListener('click',e=>{if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}},true);
}
function animateRanking(container,previous){
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const moves=[...container.querySelectorAll('.card')].map(card=>({card,from:previous.get(card.dataset.playerId),to:card.getBoundingClientRect()}));
for(const {card,from,to} of moves){
if(!from)continue;
const delta=from.top-to.top;
if(Math.abs(delta)<1)continue;
const rising=delta>0;
card.style.zIndex=rising?'3':'1';
const animation=card.animate([
{transform:`translateY(${delta}px) scale(1)`},
{transform:`translateY(${delta*.55}px) scale(${rising?1.025:1})`,offset:.45},
{transform:'translateY(0) scale(1)'}
],{duration:560,easing:'cubic-bezier(.22,1,.36,1)'});
animation.onfinish=()=>{card.style.zIndex='';};
animation.oncancel=()=>{card.style.zIndex='';};
}
}
function change(p,delta){if(!Number.isSafeInteger(p.score+delta)){alert('입력 가능한 점수 범위를 초과했어요.');return false;}p.score+=delta;save();return true;}
function palette(){const box=$('palette');box.replaceChildren();for(const c of colors){const b=document.createElement('button');b.type='button';b.className='swatch'+($('color').value===c?' selected':'');b.style.setProperty('--swatch',c);b.disabled=used(c);b.setAttribute('aria-label',`${c} 컬러${b.disabled?' (사용 중)':''}`);b.setAttribute('aria-pressed',String($('color').value===c));b.onclick=()=>{$('color').value=c;palette();};box.append(b);}}
function openPlayer(id=null){editing=id;const p=players.find(p=>p.id===id);$('playerTitle').textContent=p?'플레이어 수정':'플레이어 추가';$('nickname').value=p?p.name:randomName();$('color').value=p?p.color:randomColor();$('remove').hidden=!p;$('playerError').textContent='';palette();$('playerDialog').showModal();$('nickname').focus({preventScroll:true});}
$('playerForm').onsubmit=e=>{e.preventDefault();const name=$('nickname').value.trim(),color=$('color').value.toLowerCase();if(!name){$('playerError').textContent='닉네임을 입력해주세요.';return;}if(used(color)){$('playerError').textContent='이미 사용 중인 컬러예요. 다른 컬러를 선택해주세요.';return;}const p=players.find(p=>p.id===editing);if(p){p.name=name;p.color=color;}else players.push({id:crypto.randomUUID(),name,color,score:0});save();$('playerDialog').close();};
$('random').onclick=()=>{$('color').value=randomColor();palette();};$('color').oninput=palette;$('add').onclick=()=>openPlayer();
function confirmation(title,message,callback){$('confirmTitle').textContent=title;$('confirmText').textContent=message;pending=callback;$('confirmDialog').showModal();}
function deletePlayer(id){const p=players.find(p=>p.id===id);if(!p)return;confirmation('플레이어 삭제',`${p.name} 플레이어와 점수를 삭제할까요?`,()=>{players=players.filter(x=>x.id!==id);if(swipedId===id)swipedId=null;save();if($('playerDialog').open)$('playerDialog').close();});}
$('remove').onclick=()=>deletePlayer(editing);
$('reset').onclick=()=>confirmation('점수 초기화','모든 플레이어의 점수를 0으로 초기화할까요?',()=>{players.forEach(p=>p.score=0);save();});
$('resetPlayers').onclick=()=>confirmation('플레이어 리셋','추가된 플레이어와 점수를 모두 삭제할까요?',()=>{players=[];editing=null;scoring=null;swipedId=null;save();});
const koreanNames=['하늘','바다','구름','나무','별빛','달빛','햇살','노을','봄이','여름','가을','겨울','두리','보리','나비','토리','모모','루루','콩이','솔이','산들','이슬','초롱','다온','소담','라온','새봄','누리','도담','하루'];
const englishNames=['Sky','Sea','Cloud','Tree','Star','Moon','Sunny','Dawn','Spring','Summer','Autumn','Winter','Berry','Coco','Luna','Milo','Nova','Leo','Bean','Pine','Breeze','Dew','Spark','River','Robin','Maple','Mint','Ruby','Echo','Day'];
// Browser language is a local preference, not an IP-based country lookup.
function namePool(){return /^ko(?:-|$)/i.test(navigator.language||'en')?koreanNames:englishNames;}
function randomName(){const simpleNames=namePool();const available=simpleNames.filter(n=>!players.some(p=>p.name===n));if(available.length)return available[Math.floor(Math.random()*available.length)];const base=simpleNames[Math.floor(Math.random()*simpleNames.length)];let suffix=2;while(players.some(p=>p.name===base+suffix))suffix++;return base+suffix;}
$('bulk').onclick=()=>{$('bulkCount').value='4';$('bulkError').textContent='';$('bulkDialog').showModal();$('bulkCount').focus();};
$('bulkForm').onsubmit=e=>{e.preventDefault();const count=Number($('bulkCount').value);if(!/^[0-9]+$/.test($('bulkCount').value)||!Number.isInteger(count)||count<1||count>100){$('bulkError').textContent='1명부터 100명까지 입력해주세요.';return;}for(let i=0;i<count;i++)players.push({id:crypto.randomUUID(),name:randomName(),color:randomColor(null),score:0});save();$('bulkDialog').close();};
$('confirm').onclick=()=>{const callback=pending;pending=null;$('confirmDialog').close();if(callback)callback();};
function setSign(value){sign=value;for(const [id,s] of [['positive',1],['negative',-1]]){$(id).classList.toggle('active',s===sign);$(id).setAttribute('aria-pressed',String(s===sign));}preview();}
function preview(){const p=players.find(p=>p.id===scoring);const a=Number($('amount').value);$('preview').textContent=p?`${p.score.toLocaleString('ko-KR')} ${sign===1?'+':'−'} ${Number.isSafeInteger(a)&&a>=0?a.toLocaleString('ko-KR'):'…'} = ${Number.isSafeInteger(a)&&a>=0&&Number.isSafeInteger(p.score+sign*a)?(p.score+sign*a).toLocaleString('ko-KR'):'…'}`:'';}
function openScore(id){scoring=id;const p=players.find(p=>p.id===id);$('scoreTitle').textContent=`${p.name} · 점수 입력`;$('amount').value='';$('scoreError').textContent='';setSign(1);$('scoreDialog').showModal();$('amount').focus({preventScroll:true});$('amount').select();}
$('positive').onclick=()=>setSign(1);$('negative').onclick=()=>setSign(-1);$('amount').oninput=preview;
$('scoreForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);const p=players.find(p=>p.id===scoring);if(!/^[0-9]+$/.test($('amount').value)||!Number.isSafeInteger(amount)||amount<0||!Number.isSafeInteger(p.score+sign*amount)){$('scoreError').textContent='범위 내의 0 이상 정수를 입력해주세요.';return;}if(change(p,sign*amount))$('scoreDialog').close();};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
function fitDialogs(){const viewport=window.visualViewport;document.documentElement.style.setProperty('--keyboard-height',`${viewport?viewport.height:window.innerHeight}px`);document.documentElement.style.setProperty('--keyboard-top',`${viewport?viewport.offsetTop:0}px`);}
if(window.visualViewport){window.visualViewport.addEventListener('resize',fitDialogs);window.visualViewport.addEventListener('scroll',fitDialogs);}
window.addEventListener('resize',fitDialogs);
fitDialogs();
render();
</script>
</body>
